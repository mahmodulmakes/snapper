<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'none'; style-src 'unsafe-inline'"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #marker {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 200px;
        height: 200px;
        background: #ff00ff;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000;
        font: bold 16px -apple-system, sans-serif;
        text-align: center;
      }
      #label {
        position: fixed;
        top: 24px;
        left: 24px;
        padding: 8px 14px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        font: 14px -apple-system, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="marker">OVERLAY<br />MARKER</div>
    <div id="label">spike 3</div>
  </body>
</html>
