appId: com.snapperapp.macos
productName: Snapper
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'
# Universal Text Capture's Vision helper (native/textRecognizer/main.swift,
# built by scripts/buildTextRecognizer.mjs) — BUILD-SPEC.md §3.10. Untested
# with Phase 7's `mac.target.arch: [universal]` requirement: a plain
# `swiftc -O` build only produces the host machine's own architecture, not a
# universal binary — revisit when Phase 7 (packaging/signing/notarization,
# currently parked per PHASES.md) actually resumes, not before.
extraResources:
  - from: resources/bin
    to: bin
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [universal]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: true
    NSScreenCaptureUsageDescription: >-
      Snapper needs Screen Recording access to capture your screen.
      Nothing captured ever leaves your Mac.
dmg:
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
afterSign: build/notarize.cjs
